[project]
name = "kanso"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "platformdirs",
    "sqlmodel",
    "textual",
    "textual-serve",
]

[project.scripts]
kanso = "kanso.tui.app:main"
kanso-web = "kanso.web:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
