[project]
name = "kanso"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "platformdirs",
    "pwdlib[argon2]",
    "sqlmodel",
    "textual",
    "textual-serve",
    "uvicorn",
]

[project.scripts]
kanso = "kanso.tui.app:main"
kanso-server = "kanso.server.app:main"
kanso-web = "kanso.web:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
