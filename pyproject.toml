[project]
name = "kanso"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "iroh>=1.2.0",
    "platformdirs",
    "sqlmodel",
    "textual",
    "textual-serve",
]

[project.scripts]
kanso = "kanso.tui.app:main"
kanso-web = "kanso.web:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
filterwarnings = ["error"]
